name: CI (R targets)

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (GLPK for igraph)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk40

      - name: Install R packages
        run: |
          R -e 'install.packages(c("targets","dplyr","tibble"))'

      - name: Prepare _targets/meta directory
        run: |
          rm -f _targets/meta
          mkdir -p _targets/meta
      - name: Run targets smoke snapshot
        run: |
          R -e 'targets::tar_make(names = "smoke_snapshot")'
